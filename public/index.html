<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAPI | Sedang Dalam Pemeliharaan</title>
    
    <link rel="icon" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: #10b981;
            filter: blur(90px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.2;
            animation: move 25s infinite alternate;
        }
        @keyframes move {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(15%, 15%) scale(1.1); }
        }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden text-slate-800">

    <div class="blob top-0 left-0"></div>
    <div class="blob bottom-0 right-0" style="background: #059669; animation-delay: -7s;"></div>

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-xl w-full text-center">
            <div class="mb-5 flex justify-center">
                <img src="logokma.png" alt="Logo KMA" style="height: 100px;">
            </div>
            <div class="mb-6 leading-tight">
                <h2 class="text-emerald-600 font-extrabold uppercase tracking-tight" style="font-size: 24pt;">
                    Sistem Informasi Pengawasan Internal
                </h2>
                <p class="text-emerald-800 font-bold uppercase tracking-[0.2em] mt-1" style="font-size: 14pt;">
                    Kementerian Agama RI
                </p>
            </div>

            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6 tracking-tight">
                Sedang Dalam <span class="text-emerald-600">Pemeliharaan</span>
            </h1>
            <p class="text-slate-500 text-lg mb-10 px-4 leading-relaxed">
                Layanan <b>SIAPI</b> sedang dalam proses pemeliharaan rutin.<br> Harap tunggu sebentar, kami akan kembali sejenak lagi.
            </p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                <div class="glass p-6 rounded-3xl shadow-sm">
                    <p class="text-[10px] text-slate-400 uppercase tracking-[0.3em] font-bold mb-2">Status</p>
                    <div class="flex items-center justify-center space-x-2">
                        <span class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                        <p id="status-text" class="text-emerald-700 font-bold uppercase tracking-wide">
                            Inisialisasi
                        </p>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl shadow-sm border-emerald-100">
                    <p class="text-[10px] text-slate-400 uppercase tracking-[0.3em] font-bold mb-2">Mulai Dalam</p>
                    <p id="countdown" class="text-slate-800 font-black text-2xl tracking-tighter">15:00</p>
                </div>
            </div>

            <div class="pt-8 border-t border-slate-200/60">
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.4em]">TIM SISTEM INFORMASI - ITJEN KEMENAG</p>
            </div>

        </div>
    </div>

    <script>
        function initMaintenanceTimer() {
            const DURATION_SECONDS = 15 * 60; // 15 Menit
            const STORAGE_KEY = 'siapi_countdown_target';
            const timerDisplay = document.getElementById('countdown');
            const statusDisplay = document.getElementById('status-text');

            function getTargetTime() {
                let target = localStorage.getItem(STORAGE_KEY);
                const now = Math.floor(Date.now() / 1000);

                if (!target || now >= parseInt(target)) {
                    target = now + DURATION_SECONDS;
                    localStorage.setItem(STORAGE_KEY, target);
                }
                return parseInt(target);
            }

            let targetTime = getTargetTime();

            const updateDisplay = () => {
                const now = Math.floor(Date.now() / 1000);
                let remaining = targetTime - now;

                if (remaining <= 0) {
                    targetTime = now + DURATION_SECONDS;
                    localStorage.setItem(STORAGE_KEY, targetTime);
                    remaining = DURATION_SECONDS;
                }

                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;

                let currentStatus = "";
                if (mins >= 10) {
                    currentStatus = "Setting & Config";
                } else if (mins >= 5) {
                    currentStatus = "Build System";
                } else {
                    currentStatus = "Publishing";
                }

                statusDisplay.textContent = currentStatus;
                timerDisplay.textContent = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            updateDisplay(); 
            setInterval(updateDisplay, 1000);
        }

        document.addEventListener('DOMContentLoaded', initMaintenanceTimer);
    </script>
</body>
</html>
